[project]
name = "kb"
version = "0.1.0"
description = "Local multimodal knowledge base (media -> Markdown -> RAG)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]  # T20 = no print() in app code

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
"scripts/*" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: model-dependent or long-running tests (deselect with -m 'not slow')",
]
